{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Submit Tasks</h2>
  <p>{{ count }} task(s) for {{ today }} ready to submit.</p>
  <p>Default emails: <strong>{{ emails or '(none set)' }}</strong></p>
  <a href="{{ url_for('download_csv') }}" class="btn secondary">Download CSV</a>
  <form method="post" action="{{ url_for('submit_confirm') }}" style="display:inline;margin-left:8px">
    <button type="submit">Mark as Submitted</button>
  </form>
  <p style="margin-top:16px;font-size:13px;color:#666">Download the CSV, then email it to the addresses above. Click Mark as Submitted when done.</p>
  <a href="{{ url_for('dashboard') }}" style="display:inline-block;margin-top:12px">Back</a>
</div>
{% endblock %}
