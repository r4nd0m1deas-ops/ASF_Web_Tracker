{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2 style="margin-top:0">Edit Task</h2>
  <form method="post">
    <label>Equipment or Task</label>
    <input name="equipment" value="{{ task.equipment }}" required>
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label>Hours</label><input name="hours" type="number" min="0" value="{{ task.hours|int }}"></div>
      <div style="flex:1"><label>Minutes</label><input name="minutes" type="number" min="0" max="59" value="{{ ((task.hours - (task.hours|int)) * 60)|int }}"></div>
    </div>
    <label><input type="checkbox" name="resolved" {{ 'checked' if task.resolved }}> Resolved</label>
    <label><input type="checkbox" name="has_wo" {{ 'checked' if task.has_wo }} onchange="document.getElementById('woField').style.display=this.checked?'block':'none'"> Work Order</label>
    <div id="woField" style="{{ 'display:block' if task.has_wo else 'display:none' }}"><label>WO Number</label><input name="wo_number" value="{{ task.wo_number or '' }}"></div>
    <label>Notes</label>
    <textarea name="notes" maxlength="255" rows="2">{{ task.notes or '' }}</textarea>
    <button type="submit" style="margin-top:12px">Save</button>
    <a href="{{ url_for('dashboard') }}" class="btn secondary" style="margin-left:8px">Cancel</a>
  </form>
</div>
{% endblock %}
