{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:400px;margin:40px auto">
  <h2 style="margin-top:0;color:#2F5496">Sign In</h2>
  <form method="post">
    <label>Username</label>
    <input name="username" required autofocus>
    <label>Password</label>
    <input name="password" type="password" required>
    <button type="submit" style="margin-top:16px;width:100%">Sign In</button>
  </form>
  <p style="font-size:12px;color:#888;margin-top:16px">Default admin: admin / admin123</p>
</div>
{% endblock %}
